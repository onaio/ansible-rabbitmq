---

rabbitmq_erlang_cookie: 1qa2ws3ed
rabbitmq_ulimit_open_files: 1024
rabbitmq_memory_high_watermark: 0.4
rabbitmq_create_cluster: no
rabbitmq_cluster_master: localhost
rabbitmq_vhosts: []
rabbitmq_use_longname: 'false'

rabbitmq_logrotate_period: weekly
rabbitmq_logrotate_amount: 20

rabbitmq_amqp_port: 5672
rabbitmq_epmd_port: 4369
rabbitmq_node_port: 25672

rabbitmq_instant_queues: false
rabbitmq_instant_shovels: false

rabbitmq_plugins:
  - rabbitmq_management
  - rabbitmq_management_agent

rabbitmq_users:
  - user: admin
    password: admin
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    tags: administrator

rabbitmq_users_removed:
  - guest

rabbitmq_vhosts_queues:
  - vhost_name:
    queues: []
    user:
    password:
    durable: 'true'

##   Requires additional plugin enabled: rabbitmq_shovel
##   See https://www.rabbitmq.com/shovel-dynamic.html for json format
rabbitmq_shovels:
  -
    shovel_name:
    shovel_json: ''
  -
    shovel_name:
    shovel_json: ''


rabbitmq_old_erlang_deb_url: https://dl.bintray.com/rabbitmq-erlang/debian
rabbitmq_old_rabbitmq_deb_url: https://dl.bintray.com/rabbitmq/debian
rabbitmq_new_erlang_deb_url: http://ppa.launchpad.net/rabbitmq/rabbitmq-erlang/ubuntu
rabbitmq_new_rabbitmq_deb_url: https://packagecloud.io/rabbitmq/rabbitmq-server/ubuntu/
rabbitmq_old_erlang_component_version: erlang-23.x
rabbitmq_erlang_component_version: main #latest
rabbitmq_version: main #latest
rabbitmq_server_version: 3.8.11-1
rabbitmq_erlang_version: 1:23.*
rabbitmq_required_erlang_packages:
  - erlang-base
  - erlang-asn1
  - erlang-crypto
  - erlang-eldap
  - erlang-ftp
  - erlang-inets
  - erlang-mnesia
  - erlang-os-mon
  - erlang-parsetools
  - erlang-public-key
  - erlang-runtime-tools
  - erlang-snmp
  - erlang-ssl
  - erlang-syntax-tools
  - erlang-tftp
  - erlang-tools
  - erlang-xmerl

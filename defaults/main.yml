---
rabbitmq_erlang_cookie: 1qa2ws3ed
rabbitmq_ulimit_open_files: 1024
rabbitmq_memory_high_watermark: 0.4
rabbitmq_create_cluster: no
rabbitmq_cluster_master: localhost
rabbitmq_vhosts: []
rabbitmq_use_longname: 'false'

rabbitmq_logrotate_period: weekly
rabbitmq_logrotate_amount: 20

rabbitmq_amqp_port: 5672
rabbitmq_epmd_port: 4369
rabbitmq_node_port: 25672

rabbitmq_instant_queues: false
rabbitmq_instant_shovels: false

rabbitmq_plugins:
  - rabbitmq_management
  - rabbitmq_management_agent

rabbitmq_users:
  - user: admin
    password: admin
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    tags: administrator

rabbitmq_users_removed:
  - guest

rabbitmq_vhosts_queues:
  - vhost_name:
    queues: []
    user:
    password:
    durable: 'true'

##   Requires additional plugin enabled: rabbitmq_shovel
##   See https://www.rabbitmq.com/shovel-dynamic.html for json format
rabbitmq_shovels:
  -
    shovel_name:
    shovel_json: ''
  -
    shovel_name:
    shovel_json: ''

rabbitmq_server_version: 3.8.11
rabbitmq_deb_download_path: "/tmp/rabbitmq-server_{{ rabbitmq_server_version }}_all.deb"
rabbitmq_deb_download_url: "https://packagecloud.io/rabbitmq/rabbitmq-server/packages/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}/rabbitmq-server_{{ rabbitmq_server_version }}-1_all.deb/download"
erlang_packages:
  - erlang
  - erlang-base
  - erlang-base-hipe
  - esl-erlang

rabbitmq_version: "3.10.7"
rabbitmq_deb: "rabbitmq-server_{{ rabbitmq_version }}-1_all.deb"
rabbitmq_deb_url: "https://packagecloud.io/rabbitmq/rabbitmq-server/packages/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}/{{ rabbitmq_deb }}/download"

---
# RabbitMQ user and vhost management
- name: Get full node name
  shell: echo "$(rabbitmqctl eval "node().")" | sed  "s/'//g"
  changed_when: false
  register: node_name

- name: Set RabbitMQ node name fact
  set_fact:
    rabbitmq_node_name={{ node_name.stdout }}

- name: Ensure the users is removed
  rabbitmq_user:
    user: "{{ item }}"
    node: "{{ rabbitmq_node_name }}"
    state: absent
  with_items: "{{ rabbitmq_users_removed }}"

- name: Ensure the vhosts is present
  rabbitmq_vhost:
    name: "{{ item }}"
    state: present
  with_items: "{{ rabbitmq_vhosts }}"

- name: Ensure the users is present
  rabbitmq_user:
    user: "{{ item.user }}"
    password: "{{ item.password }}"
    node: "{{ rabbitmq_node_name }}"
    configure_priv: "{{ item.configure_priv | default('.*') }}"
    read_priv: "{{ item.read_priv | default('.*') }}"
    write_priv: "{{ item.write_priv | default('.*') }}"
    vhost: "{{ item.vhost | default('/') }}"
    permissions: "{{ item.permissions | default(omit) }}"
    tags: "{{ item.tags | default('') }}"
  with_items: "{{ rabbitmq_users }}"
  no_log: true
  tags: [configuration, rabbitmq]

- name: Ensure rabbitmqadmin script is present
  copy:
    src: rabbitmqadmin
    dest: /usr/local/bin
    mode: 0755
  when: rabbitmq_instant_queues

- name: Ensure requared queues are present
  rabbitmq_queue:
    name: "{{ item.1 }}"
    login_user: "{{ item.0.user }}"
    login_password: "{{ item.0.password }}"
    vhost: "{{ item.0.vhost_name }}"
    durable: "{{ item.0.durable }}"
    state: present
  with_subelements:
    - "{{ rabbitmq_vhosts_queues }}"
    - queues
  when: rabbitmq_instant_queues

- name: Make a shovle for for queues
  rabbitmq_parameter:
    component: shovel
    name: "{{ item.shovel_name }}"
    value: "{{ item.shovel_json }}"
  with_items:
    - "{{ rabbitmq_shovels }}"
  when: rabbitmq_instant_shovels

---
- name: Install apt https package
  apt:
    name:
      - apt-transport-https
    update_cache: true
    state: present

- name: Install erlang required packages
  apt:
    name: "{{ item }}={{ rabbitmq_packages_version }}"
    update_cache: true
    state: present
  with_items: "{{ rabbitmq_required_packages }}"

- name: Install RabbitMq Server
  apt:
    name: "rabbitmq-server={{ rabbitmq_server_version }}"
    state: present

- name: customize logrotate rules
  template:
    src: etc/logrotate.d/rabbitmq-server.j2
    dest: /etc/logrotate.d/rabbitmq-server
    owner: root
    group: root
    mode: 0644
  tags: ['rabbitmq', 'rabbitmq-logrotate']
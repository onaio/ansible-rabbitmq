---
- name: Ensure erlang is installed
  package:
    name: "{{ erlang_packages }}"
    state: present

- name: Download RabbitMQ debian package
  get_url:
    url: "{{ rabbitmq_deb_download_url }}"
    dest: "{{ rabbitmq_deb_download_path }}"

- name: Install RabbitMQ package
  apt:
    deb: "{{ rabbitmq_deb_download_path }}"
    state: present

- name: customize logrotate rules
  template:
    src: etc/logrotate.d/rabbitmq-server.j2
    dest: /etc/logrotate.d/rabbitmq-server
    owner: root
    group: root
    mode: 0644
  tags: ['rabbitmq', 'rabbitmq-logrotate']

---
- include: packages.yml
  tags: packages

- include: config-cluster.yml
  when: rabbitmq_create_cluster

- include: config.yml

- include: service.yml

- include: cluster.yml
  when:
    - rabbitmq_create_cluster
    - ansible_fqdn != rabbitmq_cluster_master

- include: rabbitmq.yml
  when:
    - not rabbitmq_create_cluster or ansible_fqdn == rabbitmq_cluster_master

- name: Flush all handlers
  meta: flush_handlers

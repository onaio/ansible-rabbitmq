---
# Setup installation repositories
# Standard repository for Debian / Ubuntu (http://www.rabbitmq.com/install-debian.html)

- name: add launchpad ppa repository key
  apt_key:
    keyserver: keyserver.ubuntu.com
    id: F77F1EDA57EBB1CC
    state: present

- name: add PackageCloud repository key
  apt_key:
    url: https://packagecloud.io/rabbitmq/rabbitmq-server/gpgkey
    state: present

- name: install lsb_release
  apt:
    name: lsb-release
    state: present

- name: get distribution code name
  shell: $(which lsb_release) -cs
  register: distribution_code_name

- name: Set rabbitmq_distribution variable
  set_fact:
    rabbitmq_distribution: "{{ distribution_code_name.stdout }}"

- name: Fail if distribution is not specified
  fail:
    msg: "Debian or Ubuntu Distribution not specified"
  when: rabbitmq_distribution is not defined

- name: remove bintray erlang apt repository
  apt_repository:
    repo: "deb {{rabbitmq_old_erlang_deb_url}} {{rabbitmq_distribution}} {{rabbitmq_old_erlang_component_version}}"
    update_cache: no
    state: absent

- name: remove bintray rabbitmq server apt repository
  apt_repository:
    repo: "deb {{rabbitmq_old_rabbitmq_deb_url}} {{rabbitmq_distribution}} {{rabbitmq_version}}"
    update_cache: no
    state: absent

- name: add erlang apt repository
  apt_repository:
    repo: "deb {{rabbitmq_new_erlang_deb_url}} {{rabbitmq_distribution}} {{rabbitmq_erlang_component_version}}"
    update_cache: yes
    state: present

- name: add rabbitmq server apt repository
  apt_repository:
    repo: "deb {{rabbitmq_new_rabbitmq_deb_url}} {{rabbitmq_distribution}} {{rabbitmq_version}}"
    update_cache: yes
    state: present

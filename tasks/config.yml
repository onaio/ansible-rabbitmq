---
# Configure RabbitMQ

- name: Set rabbitmq default file
  template:
    src: etc/default/rabbitmq-server.j2
    dest: /etc/default/rabbitmq-server
    owner: root
    group: root
    mode: 0644
  notify:
    Restart rabbitmq-server

- name: Set default settings for RabbitMQ AMQP server
  template:
    src: etc/rabbitmq/rabbitmq-env.conf.j2
    dest: /etc/rabbitmq/rabbitmq-env.conf
    owner: root
    group: root
    mode: 0644
  notify:
    Restart rabbitmq-server

- name: Symlink RabbitMQ bin to sbin(for install plugins)
  file:
    src: /usr/lib/rabbitmq/bin
    dest: /usr/lib/rabbitmq/sbin
    state: link

- name: Enable the plugins is installed
  community.rabbitmq.rabbitmq_plugin:
    names: "{{ item }}"
    prefix: /usr/lib/rabbitmq
    state: enabled
    new_only: yes
    broker_state: "{{ (rabbitmq_create_cluster) | ternary('online', 'offline') }}"
  with_items: "{{ rabbitmq_plugins }}"
  notify:
    Restart rabbitmq-server
